# Checks back/ and deploys it to the Vercel project sdgbilim-api on every push to main
# that changes back/. Setup: back/README.md, section "Deploy (Vercel)".
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "back/**"
      - ".github/workflows/deploy-back.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-back
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    env:
      # Not secrets: they only name the Vercel team and project.
      VERCEL_ORG_ID: team_0IekTq7aTmZhZx4ariEwEv6N
      VERCEL_PROJECT_ID: prj_gmlpQTuJCzerAwTHRzw0b9xk2bgp
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Type-check
        run: uv run mypy app tests

      - name: Test
        run: uv run pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Deploy to Vercel (production)
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@66 deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Report skipped deploy
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: echo "::warning::The VERCEL_TOKEN repository secret is not set, so the deploy was skipped. See back/README.md, section Deploy (Vercel)."
